name: Get Bus Data

on:
  schedule:
    # 10分ごとに実行する設定（※時間は日本時間ではなく世界標準時(UTC)で動きますが、10分おきなので気にしなくてOKです）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動で実行できるボタンも作っておく

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 必要なライブラリのインストール
        run: pip install -r requirements.txt
        
      - name: プログラムの実行
        run: python fetch_gtfs.py
        
      - name: 取得したCSVデータを保管庫に上書き保存（コミット＆プッシュ）
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add bus_history.csv
          # 変更（新しいデータ）があれば保存する
          git diff --quiet && git diff --staged --quiet || git commit -m "Update bus data"
          git push
